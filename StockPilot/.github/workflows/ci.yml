name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockpilot
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stockpilot -d stockpilot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://stockpilot:stockpilot@localhost:5432/stockpilot?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_SECONDS: 604800
      COOKIE_SECURE: false
      CORS_ORIGIN: http://localhost:3000
      VITE_API_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Générer le client Prisma
        run: npm run db:generate

      - name: Appliquer les migrations de test
        run: npm run db:deploy

      - name: Vérifier le lint
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Exécuter les tests
        run: npm test

      - name: Construire les applications
        run: npm run build
